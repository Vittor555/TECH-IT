
{% load static %}

<!DOCTYPE html>

<!-- 39.5 -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tech-IT - Editar Producto</title>
    <style>
        body { background-color: #0d0d13; color: #00ffcc; font-family: monospace; padding: 4px; max-width: 600px; margin: 40px auto; }
        h1 { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .box-editar { background: #14141f; border: 1px solid #ff0055; padding: 30px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #00ffcc; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; background: #222; color: #fff; border: 1px solid #333; padding: 8px; box-sizing: border-box; font-family: monospace; }
        .btn { background: #ff0055; color: white; border: none; padding: 10px 20px; cursor: pointer; font-family: monospace; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-cancelar { background: #444; color: #ccc; text-align: center; display: block; text-decoration: none; padding: 10px 20px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box-editar">
        <h1>MODIFICAR PRODUCTO #{{ producto.id }}</h1>
        <p>Editando: {{ producto.marca }} - {{ producto.nombre }}</p>
        <hr style="border-color: #333;">

        <form method="POST">
            {% csrf_token %}

            <!-- Django recorre el formulario y pinta las etiquetas e inputs automáticos -->
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: #ff0055;">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn">💾 GUARDAR CAMBIOS EN EL SISTEMA</button>
            <a href="{% url 'dashboard_gestion' %}" class="btn-cancelar">❌ Cancelar y Volver</a>
        </form>
    </div>

</body>
</html>
